    "name": "Joint thermodynamic compatibility of two autocatalytic cores is ∃ℝ-complete",
    "description": "The boxed and unboxed promise problems for common-state thermodynamic compatibility of exactly two supplied valid signed potential autocatalytic cores are existential-real complete under actual polynomial-time binary Turing many-one reductions. Factors are fixed positive input rationals at most two. The boxed problem has internal intervals [1/4,1/2], external catalyst intervals [1/2,1] and maximum side molecularity six; the unboxed problem has maximum side molecularity eight. Both source verdicts map to valid PAC annotations. The development proves the source-hardness bridge, exact literal-network serialization, Turing running-time bounds and total-feasibility membership using circuits for binary exponents.",
